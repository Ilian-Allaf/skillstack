name: framework

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Run every check (tests, skill linter, reference checker, lint pack rule tests)
        run: python -I tools/check.py
